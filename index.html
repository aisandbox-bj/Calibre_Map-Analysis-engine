<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calibre Map — Analysis Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Calibre Map · Analysis Engine — same app shell as the field app + viewer.
   4-tile home, per-mode accents, green brand chrome, screen nav. The analyst
   tool that turns SAP extracts + field captures into the canonical dataset.
   engine.js (validated 1428/1428) is untouched — this file is shell + wiring.
═══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#0A0D1A; --deep:#04101d; --surface:#080C14; --chrome:#14161D; --border:#2A2D3A;
  --text:#E8E9ED; --text-m:#8B8FA3; --text-d:#5C6078;
  --verify:#BA7517; --verify-t:#E0A94A; --map:#378ADD; --map-t:#5AA2EA; --equip:#1D9E75; --equip-t:#2FBE8E; --core:#9B97E8;
  --ok:#34D399; --warn:#FBBF24; --crit:#EF4444;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-head:'Rajdhani','Segoe UI',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',Arial,sans-serif;
  --f-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f-body);background:var(--void);color:var(--text);min-height:100vh;font-size:15px}
a{color:var(--map);text-decoration:none}

header{position:sticky;top:0;z-index:50;background:rgba(4,16,29,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
header .logo{display:flex;align-items:center;gap:9px;cursor:pointer}
header .cvmark{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 5px rgba(35,181,160,.5))}
header .wm{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.15em;line-height:1;display:inline-flex;align-items:baseline}
header .wm b{color:var(--text)} header .wm i{font-style:normal;margin-left:.34em;background:linear-gradient(90deg,#3FE0AE,#1C946E);-webkit-background-clip:text;background-clip:text;color:transparent}
header .wm .sub{font-family:var(--f-mono);font-size:9px;letter-spacing:.15em;color:var(--map);margin-left:10px;border:1px solid var(--border);padding:2px 6px;align-self:center}
header .crumb{font-family:var(--f-mono);font-size:10.5px;color:var(--text-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
header button{background:var(--chrome);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px;font-family:var(--f-head);font-weight:600;cursor:pointer;min-height:38px;transition:border-color .15s}
header button:hover{border-color:var(--text-d)}
header .navlink{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d);padding:8px 10px;border:1px solid transparent;border-radius:8px}
header .navlink:hover{color:var(--map);border-color:var(--border)}

main{padding:16px;max-width:1080px;margin:0 auto;padding-bottom:80px}
h2{font-family:var(--f-disp);font-size:30px;margin:6px 0 14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-family:var(--f-head);font-size:14px;margin:16px 0 8px;color:var(--text-m);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.eyebrow-mono{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d)}
.note{font-size:12px;color:var(--text-d);line-height:1.55;margin:8px 0}
.muted{color:var(--text-m)} .mono{font-family:var(--f-mono)}

/* home tiles */
.modes{display:grid;gap:12px;margin-top:10px}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.modecard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px;cursor:pointer;transition:border-color .15s,transform .15s}
.modecard:hover{transform:translateY(-2px)}
.modecard.off{opacity:.55;cursor:default} .modecard.off:hover{transform:none}
.modecard .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.modecard .name{font-family:var(--f-disp);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.modecard .desc{font-size:13px;color:var(--text-m);line-height:1.5}
.modecard .glow{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;filter:blur(48px);opacity:.18}
.modecard .step{position:absolute;top:12px;right:14px;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--text-d)}
.mc-map{border-color:rgba(55,138,221,.3)} .mc-map:hover{border-color:var(--map)} .mc-map .name,.mc-map .eyebrow{color:var(--map)} .mc-map .glow{background:var(--map)}
.mc-equip{border-color:rgba(29,158,117,.3)} .mc-equip:hover{border-color:var(--equip)} .mc-equip .name,.mc-equip .eyebrow{color:var(--equip-t)} .mc-equip .glow{background:var(--equip)}
.mc-verify{border-color:rgba(186,117,23,.3)} .mc-verify:hover{border-color:var(--verify)} .mc-verify .name,.mc-verify .eyebrow{color:var(--verify-t)} .mc-verify .glow{background:var(--verify)}
.mc-data{border-color:rgba(155,151,232,.3)} .mc-data:hover{border-color:var(--core)} .mc-data .name,.mc-data .eyebrow{color:var(--core)} .mc-data .glow{background:var(--core)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1} .stat .l{font-size:10px;color:var(--text-d);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* upload / derive */
.group-label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--map);margin:0 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.group-label span{font-family:var(--f-body);font-size:11.5px;letter-spacing:0;color:var(--text-m);text-transform:none}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.upload-grid{grid-template-columns:1fr}}
.drop{display:block;position:relative;text-align:left;cursor:pointer;background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:16px;transition:border-color .15s,background .15s}
.drop:hover,.drop.dragover{border-color:var(--map);background:rgba(55,138,221,.05)}
.drop.set{border-style:solid;border-color:var(--equip)}
.drop .name{font-family:var(--f-head);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.drop.req .name::after{content:'REQUIRED';font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;color:var(--map);border:1px solid var(--border);padding:1px 5px}
.drop .name em{font-family:var(--f-mono);font-size:9px;font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--text-d)}
.drop .name em.soon{color:var(--core)}
.drop .hint{font-family:var(--f-mono);font-size:10.5px;color:var(--text-m);line-height:1.5}
.drop .file{font-family:var(--f-mono);font-size:10.5px;color:var(--text-d);margin-top:8px;display:block}
.drop .fn{font-family:var(--f-mono);font-size:11px;color:var(--equip-t);margin-top:6px;min-height:14px;word-break:break-all}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop.planned{cursor:default;opacity:.5} .drop.planned:hover{border-color:var(--border);background:var(--surface)}
.group-div{height:1px;background:var(--border);border:none;margin:22px 0}

.primary{width:100%;min-height:48px;background:var(--map);color:#06121f;border:none;border-radius:12px;font-family:var(--f-head);font-size:15px;font-weight:700;cursor:pointer;transition:filter .15s}
.primary:hover{filter:brightness(1.1)} .primary:disabled{opacity:.4;cursor:not-allowed}
.primary.equip{background:var(--equip)} .primary.core{background:var(--core)}
.ghost{width:100%;min-height:44px;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--text-m);font-family:var(--f-head);font-weight:600;font-size:13px;cursor:pointer;transition:border-color .15s}
.ghost:hover{border-color:var(--text-d);color:var(--text)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .btnrow .ghost,.btnrow .primary{flex:1;min-width:150px}
.status{font-family:var(--f-mono);font-size:11.5px;color:var(--text-m);margin-top:14px;min-height:16px}
.rule{font-family:var(--f-mono);font-size:10.5px;color:var(--text-d)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card .fh{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;color:var(--map)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--chrome);border:1px solid var(--border);border-left:3px solid var(--map);border-radius:10px;padding:13px 15px}
.kpi .n{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1} .kpi .l{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-m);margin-top:5px}
.kpi.ok{border-left-color:var(--ok)} .kpi.ok .n{color:var(--ok)}
.kpi.crit{border-left-color:var(--crit)} .kpi.crit .n{color:var(--crit)}
.kpi.core{border-left-color:var(--core)} .kpi.violet .n{color:var(--core)}
.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin:8px 0}
.bar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#04121f;font-weight:500;min-width:0}

.search{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--text);font-family:var(--f-mono);font-size:13px;width:260px;max-width:100%;outline:none}
.search:focus{border-color:var(--map)}
.tblwrap{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-family:var(--f-body);font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(139,143,163,.08)}
th{background:var(--chrome);color:var(--text-m);font-family:var(--f-mono);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;position:sticky;top:0}
th:hover{color:var(--map)} td{background:var(--surface);color:var(--text)}
tbody tr:nth-child(even) td{background:#0a1018}
th.num,td.num{text-align:right;font-family:var(--f-mono)}
td.mn{font-family:var(--f-mono);color:var(--map);font-weight:500}
tbody tr:hover td{background:rgba(55,138,221,.06)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;padding:2px 8px;border-radius:5px;background:rgba(55,138,221,.1);color:var(--map);border:1px solid var(--border)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.kv .k{font-family:var(--f-mono);color:var(--text-d);text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;padding-top:2px} .kv .v{color:var(--text)}
details summary{cursor:pointer;color:var(--map);font-family:var(--f-mono);font-size:11px;margin-top:6px}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
@media(max-width:640px){.qrow{grid-template-columns:1fr}}
.qrow .qid{font-family:var(--f-mono);font-size:12.5px;color:var(--map)}
.qrow .qd{font-size:12.5px;color:var(--text-m);margin-top:2px}
.sel{background:var(--chrome);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--f-head);font-weight:600;font-size:12.5px;padding:8px 10px;cursor:pointer}
.sel:focus{outline:none;border-color:var(--verify-t)}
.qsave{background:var(--verify);color:#0A0D1A;border:none;border-radius:8px;font-family:var(--f-head);font-weight:700;font-size:12.5px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.qsave:hover{filter:brightness(1.1)}
.clog{font-family:var(--f-mono);font-size:11.5px;color:var(--text-m);padding:6px 0;border-top:1px dashed var(--border)}
.clog b{color:var(--equip-t)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--chrome);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="goHome()" aria-label="Calibre Map — home">
    <svg class="cvmark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="mapg" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0AE"/><stop offset="1" stop-color="#188A66"/></linearGradient></defs><g stroke="url(#mapg)" stroke-width="1.5" stroke-linecap="round"><line x1="16" y1="16" x2="7" y2="8"/><line x1="16" y1="16" x2="25" y2="9"/><line x1="16" y1="16" x2="8" y2="24"/><line x1="16" y1="16" x2="24" y2="23"/></g><g fill="url(#mapg)"><circle cx="16" cy="16" r="3.5"/><circle cx="7" cy="8" r="2"/><circle cx="25" cy="9" r="2"/><circle cx="8" cy="24" r="2"/><circle cx="24" cy="23" r="2"/></g></svg>
    <span class="wm"><b>CALIBRE</b><i>MAP</i><span class="sub">Analysis Engine</span></span>
  </div>
  <div class="crumb" id="crumb">Analysis Engine</div>
  <button id="backbtn" onclick="goBack()" style="display:none">&larr; Back</button>
  <button onclick="goHome()">Home</button>
  <a class="navlink" href="viewer.html" title="Open the Viewer">Viewer</a>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="numacore_lib.js"></script>
<script src="engine.js"></script>
<script>
const $ = s => document.querySelector(s);
const M = document.getElementById('main');
const esc = s => (window.NumaCoreLib&&NumaCoreLib.esc)?NumaCoreLib.esc(s):String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }

/* ── engine state ── */
const files = { mb51:null, iw39:null, invmstr:null, master:null, captures:null, fleet:null, gold:null };
let DERIVED=null, TABLEROWS=[], SB=null, VERIF=null, VALID=null, sortK='net', sortDir=-1, tq='';

/* ── nav ── */
let NAV=[];
function crumb(t){ $('#crumb').textContent=t; }
function here(id,fn){ NAV.push({id,fn}); $('#backbtn').style.display = NAV.length>1?'':'none'; }
function goBack(){ if(NAV.length<=1){ goHome(); return; } NAV.pop(); const p=NAV[NAV.length-1]; NAV.pop(); p.fn(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&NAV.length>1) goBack(); });

/* ── HOME ── */
function goHome(){
  NAV=[]; here('home',goHome); $('#backbtn').style.display='none';
  crumb('');
  const done=!!DERIVED, c=(DERIVED&&DERIVED.counts)||{};
  const tile=(cls,step,name,desc,fn,active)=>`<div class="modecard ${cls}${active?'':' off'}" ${active?`onclick="${fn}"`:''}><div class="glow"></div><div class="step">${step}</div>
    <div class="eyebrow">${step}</div><div class="name">${name}</div><div class="desc">${desc}</div></div>`;
  M.innerHTML = `
  <h2>What are we deriving today?</h2>
  <div class="modes">
    ${tile('mc-map','Step 1','Load &amp; Derive','Drop the SAP extracts and field captures, then run the deterministic derivation — net consumption, enrichment, verification, scoreboard.','deriveHome()',true)}
    ${tile('mc-equip','Step 2','Consumption','Net consumed per material with where-used — the recomputed consumption_by_unit, searchable.', 'consumptionScreen()', done)}
    ${tile('mc-verify','Step 3','Duplicates &amp; Scoreboard','Verification merge and the removal scoreboard — % eliminated, reorder-on-retire, running-down.','scoreboardScreen()', done)}
    ${tile('mc-data','Step 4','Dataset &amp; Export','The one canonical JSON — counts, sources, schema. Export it and open it in the Viewer.','datasetScreen()', done)}
    ${tile('mc-verify','Inbox','Query Inbox','Field flags on wrong part allocations land here. Correct an allocation once, in the canonical source — it flows to every surface.','queryInbox()', done)}
  </div>
  ${ done ? `<div class="statgrid">
      <div class="stat"><div class="n">${(c.materials||0).toLocaleString()}</div><div class="l">materials</div></div>
      <div class="stat"><div class="n">${(c.families||0).toLocaleString()}</div><div class="l">families</div></div>
      <div class="stat"><div class="n">${(c.dispositions||0).toLocaleString()}</div><div class="l">dispositions</div></div>
      <div class="stat"><div class="n">${(c.needsIdentification||0).toLocaleString()}</div><div class="l">need ID</div></div>
    </div>
    <div class="note">Derived · canonical schema v${esc(DERIVED.schemaVersion)} · phase ${esc(DERIVED.meta.phase)}. Steps 2–4 are live.</div>`
   : `<div class="note">Nothing derived yet — start with <b style="color:var(--map)">Load &amp; Derive</b>. Everything runs in your browser; nothing is uploaded. <span class="pill">engine <span id="ev"></span></span></div>` }`;
  const ev=$('#ev'); if(ev) ev.textContent=CalibreEngine.version;
}

/* ═══ STEP 1 · LOAD & DERIVE ═══ */
function deriveHome(){
  crumb('Load & Derive'); here('derive',deriveHome);
  M.innerHTML = `
  <h2 style="color:var(--map)">Load the feedstock</h2>
  <div class="group-label">SAP downloads <span>Raw extracts pulled straight from SAP each refresh cycle.</span></div>
  <div class="upload-grid">
    ${drop('mb51','MB51','',true,'.xlsx,.xls','Material movements · Posting Date, Order, Material, Movement Type, Quantity. Movements 261 / 262, ≥ 12 months.','drag .xlsx / .xls here, or click')}
    ${drop('iw39','IW39','',true,'.xlsx,.xls','Work-order list · Order → Sort Field. Maps each order to its consuming unit.','drag .xlsx / .xls here, or click')}
    ${drop('invmstr','INV MSTR','optional',false,'.xlsx,.xls','Inventory master · on-hand, MRP type, ROP, Max, description, PN. Enables enrichment + scoreboard on-hand accuracy.','drag .xlsx / .xls here, or click')}
    ${drop('fleet','Fleet Master','optional',false,'.csv,.xlsx,.xls','Equipment register · Unit → group / family label. Adds consumed-by-group roll-up.','drag .csv / .xlsx here, or click')}
    <div class="drop planned"><div class="name">PR → PO history <em class="soon">planned</em></div>
      <div class="hint">Purchase requisition → purchase order history · procurement lead time + replenishment cadence to sharpen the reorder-risk call. Slot reserved.</div>
      <span class="file">not yet active</span></div>
  </div>
  <hr class="group-div">
  <div class="group-label">Campaign inputs <span>Curated identity, field verification, and QA artifacts — not from SAP.</span></div>
  <div class="upload-grid">
    ${drop('master','Traced register','optional',false,'.csv,.xlsx,.xls','Curated identity master · description, brand, duplicate group (Group label).','drag .csv / .xlsx here, or click')}
    ${drop('captures','Field captures','optional · multiple',false,'.json','Exported materialid_bundle_*.json from the field app · verdicts (SAME / SPLIT / ALL-DIFFERENT), keep / retire.','drag .json files here, or click',true)}
    ${drop('gold','Golden CSV','optional · self-check',false,'.csv','consumption_by_unit.csv · validation only. Checks the derivation is exact — never enters the dataset.','drag .csv here, or click')}
  </div>
  <div class="btnrow"><button class="primary" id="run" disabled>Run derivation</button></div>
  <div class="rule" style="margin-top:10px">Net consumed = material-level net of MB51 261 / 262, flipped; kept where net &gt; 0.</div>
  <div class="status" id="status">Waiting for MB51 + IW39…</div>
  <button class="ghost" style="margin-top:14px" onclick="goHome()">← home</button>`;
  wireUploads();
  $('#run').addEventListener('click', runDerivation);
  refreshRunState();
}
function drop(key,name,tag,req,accept,hint,file,multiple){
  return `<label class="drop ${req?'req':''}" id="d_${key}">
    <div class="name">${name}${tag?` <em>${tag}</em>`:''}</div>
    <div class="hint">${hint}</div>
    <span class="file">${file}</span>
    <div class="fn"></div>
    <input type="file" accept="${accept}" id="f_${key}" ${multiple?'multiple':''}>
  </label>`;
}
function wireUploads(){
  ['mb51','iw39','invmstr','master','captures','fleet','gold'].forEach(key=>{
    const inp=$('#f_'+key), d=$('#d_'+key); if(!inp||!d) return;
    // reflect any prior selection kept in `files`
    const cur=files[key], has=Array.isArray(cur)?cur.length:!!cur;
    if(has){ d.classList.add('set'); d.querySelector('.fn').textContent = Array.isArray(cur)?(cur.length+' file(s) selected'):cur.name; }
    inp.addEventListener('change', e=>{
      const fl=e.target.files;
      files[key] = inp.multiple ? [...fl] : (fl[0]||null);
      const h = inp.multiple ? files[key].length : !!files[key];
      d.classList.toggle('set', !!h);
      d.querySelector('.fn').textContent = inp.multiple ? (h? h+' file(s) selected':'') : (files[key]?files[key].name:'');
      refreshRunState(); if(h) setStatus('Ready to run.');
    });
    ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('dragover');}));
    ['dragleave','dragend','drop'].forEach(ev=>d.addEventListener(ev,()=>d.classList.remove('dragover')));
  });
}
function refreshRunState(){ const r=$('#run'); if(r) r.disabled = !(files.mb51&&files.iw39); }
function setStatus(t){ const s=$('#status'); if(s) s.textContent=t; }

/* ── readers ── */
function readXlsx(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellDates:true}); res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null})); }catch(err){ rej(err);} }; r.onerror=()=>rej(new Error('read failed')); r.readAsArrayBuffer(file); }); }
function readText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read failed')); r.readAsText(file); }); }
function parseCSV(text){ const out=[]; let row=[],field='',i=0,q=false; if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false;} else field+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(field);field='';} else if(c==='\r'){} else if(c==='\n'){row.push(field);out.push(row);row=[];field='';} else field+=c; }
    i++; }
  if(field.length||row.length){row.push(field);out.push(row);} return out; }
function csvToObjects(text){ const a=parseCSV(text); if(!a.length)return[]; const h=a[0].map(x=>String(x).trim()); return a.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o;}); }
function fleetMap(rows){ const m={}; if(!rows)return m; rows.forEach(r=>{ const u=String(r['Unit']||r['Sort Field']||'').trim(); if(!u)return; let g=String(r['Family']||'').trim(); if(!g)g=[r['Make'],r['Model']].map(x=>String(x||'').trim()).filter(Boolean).join(' '); if(g)m[u]=g; }); return m; }

/* ── the derivation (engine.js does the maths; this just orchestrates I/O) ── */
async function runDerivation(){
  try{
    $('#run').disabled=true; setStatus('Reading MB51 + IW39…');
    const [mb,iwRows]=await Promise.all([readXlsx(files.mb51),readXlsx(files.iw39)]);
    setStatus('Deriving…');
    const iw=CalibreEngine.indexIW39(iwRows);
    const mats=CalibreEngine.derive(mb,iw);
    if(files.invmstr||files.master){
      setStatus('Enriching (INV MSTR / master)…');
      const invBy = files.invmstr ? CalibreEngine.indexBy(await readXlsx(files.invmstr),'Material') : {};
      let trBy={};
      if(files.master){ const mr=files.master.name.toLowerCase().endsWith('.csv')?csvToObjects(await readText(files.master)):await readXlsx(files.master); trBy=CalibreEngine.indexBy(mr,'Material'); }
      CalibreEngine.enrich(mats,{invByMat:invBy,tracedByMat:trBy});
    }
    let fmap={}, fleetRows=null;
    if(files.fleet){ fleetRows=files.fleet.name.toLowerCase().endsWith('.csv')?csvToObjects(await readText(files.fleet)):await readXlsx(files.fleet); fmap=fleetMap(fleetRows); }
    const rows=[];
    Object.keys(mats).forEach(mn=>{ const m=mats[mn]; if(m.netAll<=0)return; const top=m.whereUsed[0];
      rows.push({ mn, net:m.netAll, units:m.whereUsed.length, onHand:(m.onHand===''||m.onHand==null)?'':m.onHand,
        mrp:m.mrpType||'', dup:m.dupGroup||'', byUnit:m.whereUsed.map(w=>w.unit+': '+w.qty).join('; '),
        byGroup: files.fleet?CalibreEngine.consumedByFamily(m,fmap):'', desc:m.description||'', _m:m }); });
    const enriched=!!(files.invmstr||files.master);
    let derived={ meta:{ tool:'calibre-analysis-engine', phase:enriched?2:1, generatedFrom:{mb51:files.mb51.name,iw39:files.iw39.name}, rule:'net consumed = material-level net of MB51 261/262 flipped; net>0' },
      materials: rows.map(r=>{ const m=r._m; return { material:r.mn, description:r.desc||undefined, pn:m.pn||undefined,
        net_consumed:r.net, on_hand:enriched?m.onHand:undefined, mrp_type:m.mrpType||undefined, rop:enriched?m.rop:undefined, max:enriched?m.max:undefined,
        traced_brand:m.tracedBrand||undefined, duplicate_group:m.dupGroup||undefined, identified:m.identified,
        category:m.category||undefined, category_confidence:m.categoryConfidence||undefined, category_reason:m.categoryReason||undefined, fits:m.fits||undefined,
        where_used:(m.whereUsed&&m.whereUsed.length)?m.whereUsed:undefined, consuming_units:r.units, consumed_by_unit:r.byUnit, consumed_by_group:r.byGroup||undefined }; }) };
    TABLEROWS=rows;
    VERIF=null; SB=null;
    if(files.captures&&files.captures.length){
      setStatus('Merging field captures…');
      const bundles=[]; for(const cf of files.captures){ try{ bundles.push(JSON.parse(await readText(cf))); }catch(e){ console.warn('bad bundle',cf.name,e); } }
      VERIF=CalibreEngine.mergeVerification(derived,bundles); derived.meta.phase=3;
      const sb=CalibreEngine.buildScoreboard(derived); if(sb.rows.length){ derived.meta.phase=4; SB=sb; }
    }
    VALID=null;
    if(files.gold){ VALID=await validate(mats); }
    derived.fleet = fleetRows ? CalibreEngine.buildFleet(fleetRows) : [];
    derived=CalibreEngine.assembleCanonical(derived,{ generatedAt:new Date().toISOString(),
      sourceFiles:{ mb51:files.mb51&&files.mb51.name, iw39:files.iw39&&files.iw39.name, invMstr:files.invmstr&&files.invmstr.name, master:files.master&&files.master.name }, phase:derived.meta.phase });
    DERIVED=derived; KPI_IW=Object.keys(iw.woUnit).length; KPI_SEEN=Object.keys(mats).length;
    setStatus('Done — '+rows.length+' materials with net consumption.');
    toast('Derived '+rows.length.toLocaleString()+' materials'); goHome();
  }catch(err){ setStatus('Error: '+err.message); console.error(err); }
  finally{ const r=$('#run'); if(r) r.disabled=false; }
}
let KPI_IW=0, KPI_SEEN=0;
async function validate(mats){
  const gold=csvToObjects(await readText(files.gold));
  let total=0,match=0,mism=0,missing=0; const ex=[];
  gold.forEach(g=>{ const mn=String(g['Material']||'').trim(); if(!mn)return; total++;
    const want=parseFloat(g['Net consumed']||'0')||0;
    if(!(mn in mats)){ missing++; return; }
    const got=CalibreEngine.round1(mats[mn].netAll);
    if(Math.abs(got-want)<0.5) match++; else { mism++; if(ex.length<8) ex.push(`${mn}: golden ${want} vs engine ${got}`); } });
  return { total,match,mism,missing,ex,pass:(mism===0&&missing===0) };
}

function renderTable(){
  const q=(tq||'').trim().toLowerCase();

  rows=rows.slice().sort((a,b)=>{ let x=a[sortK],y=b[sortK]; if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase();return sortDir*(x<y?-1:x>y?1:0);} return sortDir*((x||0)-(y||0)); });
  const cap=500;
  $('#tbl tbody').innerHTML = rows.slice(0,cap).map(r=>`<tr><td class="mn">${esc(r.mn)}</td><td>${esc(r.desc)}</td><td class="num">${r.net}</td><td class="num">${r.onHand}</td><td class="mono">${esc(r.mrp)}</td><td class="num">${r.units}</td><td>${esc(r.dup)}</td></tr>`).join('');
  $('#tblnote').textContent = rows.length>cap?`Showing top ${cap} of ${rows.length}.`:`${rows.length} materials.`;
}

/* ═══ STEP 3 · DUPLICATES & SCOREBOARD ═══ */
function scoreboardScreen(){
  if(!DERIVED){ toast('Load & derive first'); return deriveHome(); }
  crumb('Duplicates & Scoreboard'); here('scoreboard',scoreboardScreen);
  let html=`<h2 style="color:var(--verify-t)">Duplicates &amp; scoreboard</h2>`;
  if(SB){ const k=SB.kpi; const tot=k.retireSkus||0; const seg=(n,col)=>{ const pct=tot?Math.round(100*n/tot):0; return pct?`<span style="width:${pct}%;background:${col}">${pct>7?n:''}</span>`:''; };
    html+=`<div class="card"><div class="fh" style="color:var(--verify-t)">Removal scoreboard — duplicate disposition</div>
      <div class="kpis">
        <div class="kpi ok"><div class="n">${k.pctEliminated}%</div><div class="l">eliminated</div></div>
        <div class="kpi crit"><div class="n">${k.reorderRisk}</div><div class="l">reorder-on-retire</div></div>
        <div class="kpi ok"><div class="n">${k.runningDown}</div><div class="l">running-down</div></div>

      </div>
      <div class="bar">${seg(SB.eliminated!=null?SB.eliminated:0,'var(--text-d)')}${seg(k.runningDown,'var(--ok)')}${seg(k.reorderRisk,'var(--crit)')}</div>
      <div class="note">${(k.onHandInRetire||0).toLocaleString()} units on-hand tied in retired numbers${k.provisionalFamilies?` · ${k.provisionalFamilies} family(ies) “no technical preference”`:''}. Needs INV MSTR for on-hand accuracy.</div></div>`;
  } else html+=`<div class="card"><div class="fh">Removal scoreboard</div><div class="note">No disposition yet — load field captures (materialid_bundle_*.json) in Step 1 to populate verdicts and the scoreboard.</div></div>`;
  if(VERIF){ html+=`<div class="card"><div class="fh" style="color:var(--verify-t)">Verification merge</div>
    <div class="kpis"><div class="kpi ok"><div class="n">${VERIF.families}</div><div class="l">families field-verified</div></div>
      <div class="kpi"><div class="n">${VERIF.verdicts.SAME}</div><div class="l">SAME</div></div>
      <div class="kpi"><div class="n">${VERIF.verdicts.SPLIT}</div><div class="l">SPLIT</div></div>
      <div class="kpi"><div class="n">${VERIF.verdicts.ALL_DIFFERENT}</div><div class="l">all-different</div></div></div>
    <div class="note">${VERIF.provisional} “no tech preference” · ${VERIF.captures} record(s) from ${VERIF.bundles} bundle(s).</div></div>`; }
  if(VALID){ html+=`<div class="card"><div class="fh" style="color:${VALID.pass?'var(--ok)':'var(--crit)'}">Self-check vs golden</div>

    ${VALID.ex.length?`<details><summary>show mismatches</summary><div class="note mono">${VALID.ex.map(esc).join('<br>')}</div></details>`:''}</div>`; }
  html+=`<button class="ghost" style="margin-top:6px" onclick="goHome()">← home</button>`;
  M.innerHTML=html;
}

/* ═══ QUERY INBOX · edit allocation (single-source correction) ═══ */
const CATS=['Brakes','Air system','Charging & starting','Lighting & electrical','Wheel end','Driveline','Suspension & steering','Winter package','Coupling & trailer','Engine & emissions','Cab & body'];
let IQ='';
function queryInbox(){
  if(!DERIVED){ toast('Load & derive first'); return deriveHome(); }
  crumb('Query Inbox'); here('inbox',queryInbox);
  DERIVED.corrections = DERIVED.corrections || [];
  const flags=(DERIVED.verification||[]).filter(v=>v.type==='allocation_flag');
  const log=DERIVED.corrections;
  M.innerHTML = `
  <h2 style="color:var(--verify-t)">Query Inbox</h2>
  <div class="card"><div class="fh" style="color:var(--verify-t)">Flags from the field</div>
    ${flags.length? '<div class="list">'+flags.map(f=>`<div class="qrow"><div><div class="qid">${esc(f.material||f.family_id||'')}</div><div class="qd">${esc(f.finding||f.site_answer||'allocation flag')}${f.tech?' · by '+esc(f.tech):''}</div></div></div>`).join('')+'</div>'
      : '<div class="note">No allocation flags in the loaded captures yet. Techs raise these in the field App (flag → not edit); they arrive here with the capture bundles. The App-side flag control is on the roadmap — the correction path below already works today.</div>'}
  </div>
  <div class="card"><div class="fh" style="color:var(--verify-t)">Auto-queued for category review — <span id="qct"></span></div>
    <div class="note" style="margin:0 0 10px">Parts the categoriser placed with <b>low confidence</b> — worth a quick web-check to upgrade — impact-sorted (highest net consumption first). Set the right system and Save; written <b>once</b> to the canonical dataset, drops off the queue. Showing top 50. <b>Unclassified</b> parts (no keyword) are deliberately NOT queued — they sit in their own bucket in the Viewer's Parts Mapping.</div>
    <div id="autoq"></div>
  </div>
  <div class="card"><div class="fh" style="color:var(--verify-t)">Correct an allocation (search)</div>
    <div class="note" style="margin:0 0 12px">Or find any part directly, set its correct system, and save. Same single-source correction — flows to the App and Viewer on the next export.</div>
    <input class="search" id="iq" style="width:100%;margin-bottom:12px" placeholder="search SAP # · PN · description…" value="${esc(IQ)}">
    <div id="iresults"></div>
  </div>
  ${log.length?`<div class="card"><div class="fh" style="color:var(--equip-t)">Corrections this session — ${log.length}</div>
    ${log.slice().reverse().map(c=>`<div class="clog">${esc(c.material)} · ${esc(c.field)}: ${esc(c.from||'—')} → <b>${esc(c.to)}</b></div>`).join('')}</div>`:''}
  <button class="ghost" style="margin-top:6px" onclick="goHome()">← home</button>`;
  const iq=$('#iq'); iq.addEventListener('input',e=>{ IQ=e.target.value; renderInbox(); });
  renderQueue(); renderInbox();
}
function renderQueue(){
  const el=$('#autoq'); if(!el) return;
  const rows=(DERIVED.materials||[]).filter(m=>m.category_confidence==='low')
    .sort((a,b)=>(Number(b.net_consumed)||0)-(Number(a.net_consumed)||0));
  const ct=$('#qct'); if(ct) ct.textContent=rows.length;
  el.innerHTML = rows.length ? rows.slice(0,50).map(m=>{
    const cur=m.category||'';
    const opts=['<option value="">— unassigned —</option>'].concat(CATS.map(c=>`<option value="${esc(c)}"${c===cur?' selected':''}>${esc(c)}</option>`)).join('');
    const cf=m.category_confidence, col=cf==='none'?'var(--text-d)':'var(--warn)';
    return `<div class="qrow">
      <div><div class="qid">${esc(m.material)}${m.pn?' · '+esc(m.pn):''} <span style="color:${col};font-family:var(--f-mono);font-size:10px">${esc(cf)}</span></div>
      <div class="qd">${esc(m.description||'')} · <span style="color:var(--text-d)">now: ${esc(cur||'unassigned')}${m.category_reason?' — '+esc(m.category_reason):''}</span></div></div>
      <select class="sel" data-mn="${esc(m.material)}">${opts}</select>
      <button class="qsave" data-mn="${esc(m.material)}">Save</button></div>`;
  }).join('') : '<div class="note">Queue empty — every categorised part is high-confidence.</div>';
  el.querySelectorAll('.qsave').forEach(b=>b.addEventListener('click',()=>saveCorrection(b.dataset.mn)));
}
function renderInbox(){
  const R=$('#iresults'); if(!R) return;
  const q=(IQ||'').trim().toLowerCase();
  if(q.length<2){ R.innerHTML='<div class="note">Type at least 2 characters.</div>'; return; }
  const hits=(DERIVED.materials||[]).filter(m=>
    String(m.material).toLowerCase().includes(q) || String(m.pn||'').toLowerCase().includes(q) || String(m.description||'').toLowerCase().includes(q)
  ).slice(0,40);
  R.innerHTML = hits.length ? hits.map(m=>{
    const cur=m.category||'';
    const opts=['<option value="">— unassigned —</option>'].concat(CATS.map(c=>`<option value="${esc(c)}"${c===cur?' selected':''}>${esc(c)}</option>`)).join('');
    return `<div class="qrow">
      <div><div class="qid">${esc(m.material)}${m.pn?' · '+esc(m.pn):''}</div><div class="qd">${esc(m.description||'')} · <span style="color:var(--text-d)">now: ${esc(cur||'unassigned')}</span></div></div>
      <select class="sel" data-mn="${esc(m.material)}">${opts}</select>
      <button class="qsave" data-mn="${esc(m.material)}">Save</button></div>`;
  }).join('') : '<div class="note">No match.</div>';
  R.querySelectorAll('.qsave').forEach(b=>b.addEventListener('click',()=>saveCorrection(b.dataset.mn)));
}
function saveCorrection(mn){
  const sel=document.querySelector('.sel[data-mn="'+CSS.escape(mn)+'"]'); if(!sel) return;
  const to=sel.value; const m=(DERIVED.materials||[]).find(x=>String(x.material)===String(mn)); if(!m) return;
  const from=m.category||'';
  m.category=to||undefined;
  m.category_confidence='high'; m.category_reason='analyst-confirmed';   // confirmed → drops off the auto-queue
  DERIVED.corrections=DERIVED.corrections||[];
  if(from!==to) DERIVED.corrections.push({ material:String(mn), field:'category', from:from, to:to, ts:new Date().toISOString(), by:'analyst' });
  toast(from!==to ? ('Corrected '+mn+' → '+(to||'unassigned')) : ('Confirmed '+mn));
  queryInbox();
}

goHome();
