<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calibre Map — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Calibre Map · Viewer — desktop/tablet sibling of the field app.
   Layout, skin and flow mirror the Calibre Map Companion app (v2.00 design
   system): 4-tile home, per-mode accents, green brand chrome, screen nav.
   Self-contained single file (moves by USB). Reads the canonical dataset the
   Analysis Engine exports; read-only.
═══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#0A0D1A; --deep:#04101d; --surface:#080C14; --chrome:#14161D; --border:#2A2D3A;
  --text:#E8E9ED; --text-m:#8B8FA3; --text-d:#5C6078;
  --verify:#BA7517; --verify-t:#E0A94A; --map:#378ADD; --map-t:#5AA2EA; --equip:#1D9E75; --equip-t:#2FBE8E; --core:#9B97E8;
  --ok:#34D399; --warn:#FBBF24; --crit:#EF4444;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-head:'Rajdhani','Segoe UI',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',Arial,sans-serif;
  --f-mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f-body);background:var(--void);color:var(--text);min-height:100vh;font-size:15px;font-weight:400}
a{color:var(--map);text-decoration:none}

/* ── header ── */
header{position:sticky;top:0;z-index:50;background:rgba(4,16,29,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
header .logo{display:flex;align-items:center;gap:9px;cursor:pointer}
header .cvmark{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 5px rgba(35,181,160,.5))}
header .wm{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.15em;line-height:1;display:inline-flex;align-items:baseline}
header .wm b{color:var(--text);font-weight:700}
header .wm i{font-style:normal;font-weight:700;margin-left:.34em;background:linear-gradient(90deg,#3FE0AE,#1C946E);-webkit-background-clip:text;background-clip:text;color:transparent}
header .crumb{font-family:var(--f-mono);font-size:10.5px;color:var(--text-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
header .saveind{font-family:var(--f-mono);font-size:9.5px;color:var(--text-d);white-space:nowrap}
header button{background:var(--chrome);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px;font-family:var(--f-head);font-weight:600;cursor:pointer;min-height:38px;transition:border-color .15s}
header button:hover{border-color:var(--text-d)}
header .navlink{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d);padding:8px 10px;border:1px solid transparent;border-radius:8px}
header .navlink:hover{color:var(--map);border-color:var(--border)}

main{padding:16px;max-width:960px;margin:0 auto;padding-bottom:80px}
h2{font-family:var(--f-disp);font-size:30px;margin:6px 0 14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-family:var(--f-head);font-size:14px;margin:16px 0 8px;color:var(--text-m);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.eyebrow-mono{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-d)}
.note{font-size:12px;color:var(--text-d);line-height:1.55;margin:8px 0}
.muted{color:var(--text-m)}

/* ── home: mode cards ── */
.modes{display:grid;gap:12px;margin-top:10px}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.modecard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px;cursor:pointer;transition:border-color .15s,transform .15s}
.modecard:hover{transform:translateY(-2px)}
.modecard .eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.modecard .name{font-family:var(--f-disp);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.modecard .desc{font-size:13px;color:var(--text-m);line-height:1.5}
.modecard .glow{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;filter:blur(48px);opacity:.18}
.mc-verify{border-color:rgba(186,117,23,.3)} .mc-verify:hover{border-color:var(--verify)} .mc-verify .name,.mc-verify .eyebrow{color:var(--verify-t)} .mc-verify .glow{background:var(--verify)}
.mc-map{border-color:rgba(55,138,221,.3)} .mc-map:hover{border-color:var(--map)} .mc-map .name,.mc-map .eyebrow{color:var(--map)} .mc-map .glow{background:var(--map)}
.mc-equip{border-color:rgba(29,158,117,.3)} .mc-equip:hover{border-color:var(--equip)} .mc-equip .name,.mc-equip .eyebrow{color:var(--equip-t)} .mc-equip .glow{background:var(--equip)}
.mc-data{border-color:rgba(155,151,232,.3)} .mc-data:hover{border-color:var(--core)} .mc-data .name,.mc-data .eyebrow{color:var(--core)} .mc-data .glow{background:var(--core)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1}
.stat .l{font-size:10px;color:var(--text-d);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* ── load / empty ── */
.loadhero{border:2px dashed var(--border);border-radius:16px;padding:48px 30px;text-align:center;background:var(--surface);position:relative;overflow:hidden;transition:border-color .15s,background .15s}
.loadhero.over{border-color:var(--map);background:rgba(55,138,221,.06)}
.loadhero svg{width:52px;height:52px;margin-bottom:16px;color:var(--map)}
.loadhero h2{margin-bottom:8px}
.loadhero p{color:var(--text-m);font-size:13.5px;margin-bottom:20px;line-height:1.6}

/* ── folder tabs (Parts Mapping) ── */
.ftabs{display:flex;gap:6px;padding:0 2px;position:relative;z-index:2}
.ftab{display:flex;align-items:center;gap:8px;padding:11px 18px 12px;border:1px solid var(--border);border-radius:11px 11px 0 0;font-family:var(--f-head);font-weight:600;font-size:14px;letter-spacing:.03em;cursor:pointer;color:var(--text-d);background:#05101c;transition:color .15s}
.ftab svg{width:15px;height:15px}
.ftab.on{color:var(--map);background:var(--void);border-bottom-color:var(--void);margin-bottom:-1px;font-weight:700}
.fpanel{border:1px solid var(--border);border-radius:0 12px 12px 12px;background:var(--void);padding:16px 14px}

.search{width:100%;background:var(--surface);border:1px solid rgba(55,138,221,.45);border-radius:12px;color:var(--text);padding:14px;font-size:16px;outline:none;margin-bottom:12px;font-family:var(--f-mono);transition:box-shadow .15s}
.search:focus{border-color:var(--map);box-shadow:0 0 0 4px rgba(55,138,221,.12)}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s}
.row:hover{border-color:var(--map)}
.row .t{font-weight:600;font-size:15px}
.row .t .sap{color:var(--text-d);font-weight:400;font-family:var(--f-mono);font-size:12.5px}
.row .t b{color:var(--map);font-weight:600}
.row .s{font-size:12.5px;color:var(--text-m);margin-top:3px;line-height:1.45}
.row .badges{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);color:var(--text-m);text-transform:uppercase;letter-spacing:.04em}
.b-dup{border-color:rgba(239,68,68,.5);color:var(--crit)}
.b-oh{border-color:rgba(52,211,153,.4);color:var(--ok)}
.b-net{border-color:rgba(55,138,221,.4);color:var(--map)}
.b-mrp{border-color:rgba(155,151,232,.4);color:var(--core)}
.b-same{border-color:rgba(52,211,153,.5);color:var(--ok)}
.b-split{border-color:rgba(251,191,36,.5);color:var(--warn)}
.tic{width:38px;height:38px;border-radius:10px;background:rgba(55,138,221,.10);border:1px solid rgba(55,138,221,.35);display:grid;place-items:center;color:var(--map);flex:none}
.tic svg{width:18px;height:18px}
/* ── system/sub-system tiles (fleet drill) ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:64px;transition:border-color .15s}
.tile:hover{border-color:var(--map)}
.tile .tn{font-family:var(--f-head);font-weight:600;font-size:14.5px;line-height:1.25;color:var(--text)}
.tile .tc{font-family:var(--f-mono);font-size:10.5px;color:var(--text-d);margin-top:2px}
.tile.zero{opacity:.5}
.tile.consumed .tic{background:rgba(35,181,138,.10);border-color:rgba(35,181,138,.35);color:var(--accent-glow)}
.chev{margin-left:auto;color:var(--text-d);flex:none}
.chev svg{width:18px;height:18px}

/* ── part / unit detail ── */
.hero{border:1px solid var(--border);border-left:4px solid var(--map);background:linear-gradient(90deg,rgba(55,138,221,.10),var(--surface));border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.hero .pn{font-family:var(--f-disp);font-size:30px;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere}
.hero .dl{font-size:13px;color:var(--text-m);margin-top:4px}
.factgrid{display:grid;gap:12px;margin-bottom:14px}
@media(min-width:640px){.factgrid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.card .fh{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;color:var(--map)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:13px}
.kv .k{font-family:var(--f-mono);color:var(--text-d);text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;padding-top:2px}
.kv .v{color:var(--text)} .kv .v b{color:var(--text)}
.kv .ref{color:var(--core);font-weight:600;font-family:var(--f-mono);font-size:12.5px}
.warnbox{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-left:3px solid var(--crit);border-radius:10px;padding:12px 14px;font-size:13px;color:#f7b3b3;margin-bottom:14px}
.warnbox b{color:#ffd2d2}
.okbox{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.3);border-left:3px solid var(--equip);border-radius:10px;padding:12px 14px;font-size:13px;color:#bfe6d6;margin-bottom:14px}
.dupmemb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--border);cursor:pointer}
.dupmemb:hover .dupmn{color:var(--map-t)}
.dupmemb .dupmn{font-family:var(--f-mono);font-size:12.5px;color:var(--map);font-weight:500}
.dupmemb .dupid{font-size:12px;color:var(--text-m)}
.dupmemb .dupoh{font-family:var(--f-mono);font-size:11px;color:var(--text-d);white-space:nowrap}
.dupmemb .keep{color:var(--ok)} .dupmemb .ret{color:var(--crit)}
.wu .u{border-top:1px solid var(--border);padding:9px 0}
.wu .uh{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px}
.wu .uh b{color:var(--map)}
.wu .wos{font-size:11px;color:var(--text-m);margin-top:3px;font-family:var(--f-mono)}

/* ── buttons ── */
.primary{width:100%;min-height:48px;background:var(--map);color:#06121f;border:none;border-radius:12px;font-family:var(--f-head);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .15s}
.primary:hover{filter:brightness(1.1)}
.primary.equip{background:var(--equip)} .primary.core{background:var(--core)}
.ghost{width:100%;min-height:44px;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--text-m);font-family:var(--f-head);font-weight:600;font-size:13px;cursor:pointer;margin-top:8px;transition:border-color .15s}
.ghost:hover{border-color:var(--text-d);color:var(--text)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .ghost,.btnrow .primary{flex:1;min-width:150px}

/* ── families / candidate cards ── */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.fam{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--verify);border-radius:12px;padding:15px 17px}
.fam.cand{border-top-color:var(--warn)}
.fam .fh{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.fam .fid{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:.04em}
.fam .fid.sm{font-size:15px;font-family:var(--f-head);letter-spacing:.02em}
.memb{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-family:var(--f-mono);font-size:12px;border-top:1px dashed var(--border);cursor:pointer}
.memb:hover span:first-child{color:var(--map-t)}
.memb .mnm{color:var(--map)} .memb .keep{color:var(--ok)} .memb .ret{color:var(--crit)}
.pillv{display:inline-block;font-family:var(--f-mono);font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.pillv.same{color:var(--ok);border-color:rgba(52,211,153,.5)}
.pillv.split{color:var(--warn);border-color:rgba(251,191,36,.5)}
.pillv.prov{color:var(--core);border-color:rgba(155,151,232,.5)}
.pillv.cand{color:var(--warn);border-color:rgba(251,191,36,.5)}

/* ── scoreboard (data/summary) ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--map);border-radius:10px;padding:14px 16px}
.kpi .n{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-m);margin-top:5px}
.kpi.ok{border-left-color:var(--ok)} .kpi.ok .n{color:var(--ok)}
.kpi.crit{border-left-color:var(--crit)} .kpi.crit .n{color:var(--crit)}
.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin:6px 0 10px}
.bar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#04121f;font-weight:500;min-width:0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--chrome);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="goHome()" aria-label="Calibre Map — home">
    <svg class="cvmark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="mapg" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse"><stop stop-color="#3FE0AE"/><stop offset="1" stop-color="#188A66"/></linearGradient></defs><g stroke="url(#mapg)" stroke-width="1.5" stroke-linecap="round"><line x1="16" y1="16" x2="7" y2="8"/><line x1="16" y1="16" x2="25" y2="9"/><line x1="16" y1="16" x2="8" y2="24"/><line x1="16" y1="16" x2="24" y2="23"/></g><g fill="url(#mapg)"><circle cx="16" cy="16" r="3.5"/><circle cx="7" cy="8" r="2"/><circle cx="25" cy="9" r="2"/><circle cx="8" cy="24" r="2"/><circle cx="24" cy="23" r="2"/></g></svg>
    <span class="wm"><b>CALIBRE</b><i>MAP</i></span>
  </div>
  <div class="crumb" id="crumb">Viewer</div>
  <span class="saveind" id="saveInd"></span>
  <button id="backbtn" onclick="goBack()" style="display:none">&larr; Back</button>
  <button onclick="goHome()">Home</button>
  <a class="navlink" href="index.html" title="Open the Analysis Engine">Engine</a>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const M = document.getElementById('main');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => (typeof n==='number'? n.toLocaleString() : (n==null?'':n));
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const IC = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-6z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
};

let DATA=null, NAV=[], MAP_TAB='find', LASTQ='', LASTUQ='';
let DUPINDEX={}, FAMBYMAT={}, UNITINDEX={}, MATBYMN={}, FLEETBYUNIT={}, CATINDEX={};
const CAT_ORDER=['Brakes','Air system','Charging & starting','Lighting & electrical','Wheel end','Driveline','Suspension & steering','Winter package','Coupling & trailer','Engine & emissions','Cab & body','Unclassified'];

/* ── system-zone taxonomy — ported verbatim from the field app so the drill
   flows identically. Zones per unit type; sub-systems filter by category + keyword. ── */
const TRACTOR_ZONES=[
  {id:'cab',label:'Cab & body',cats:['Lighting & electrical','Winter package','Cab & body']},
  {id:'engine',label:'Engine bay',cats:['Engine & emissions','Charging & starting','Air system']},
  {id:'steer',label:'Steer axle',cats:['Suspension & steering','Wheel end']},
  {id:'frame',label:'Frame & driveline',cats:['Driveline','Coupling & trailer']},
  {id:'tandem',label:'Rear tandems · brakes',cats:['Brakes','Suspension & steering','Wheel end','Driveline']}
];
const TRAILER_ZONES=[
  {id:'coupling',label:'Kingpin · landing gear',cats:['Coupling & trailer']},
  {id:'deck',label:'Deck · body · electrical',cats:['Lighting & electrical','Coupling & trailer','Cab & body']},
  {id:'bogey',label:'Axles · brakes · suspension',cats:['Brakes','Suspension & steering','Wheel end','Air system']}
];
const SUBSYS={
  steer:[{l:'King pins & knuckles',cats:['Suspension & steering','Wheel end'],kw:'KING ?PIN|KNUCKLE|DRAWKEY'},
    {l:'Tie rod & drag link',cats:['Suspension & steering'],kw:'TIE ROD|DRAG LINK|ROD END|ROD ASSY'},
    {l:'Steering gear & pump',cats:['Suspension & steering'],kw:'STEERING GEAR|GEARBOX|PS PUMP|POWER STEERING|PUMP, STEERING|TAS|RGT|SP33'},
    {l:'Hubs, bearings & seals',cats:['Wheel end'],kw:'HUB|BEARING|SEAL|STUD|NUT|CUP|CONE'},
    {l:'Springs & shackles',cats:['Suspension & steering'],kw:'SPRING|SHACKLE|PIN|BUSHING'},

/* ── persistence: keep the loaded dataset across restarts (IndexedDB + localStorage fallback) ── */
const STORE_KEY='calibre_map.viewer.dataset';
const Store=(function(){
  const DBN='calibre_map', ST='kv';
  function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(ST); }catch(_){}};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
  async function set(k,v){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const t=db.transaction(ST,'readwrite'); t.objectStore(ST).put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); }); }catch(e){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(_){ return false; } } }
  async function get(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const t=db.transaction(ST,'readonly'); const rq=t.objectStore(ST).get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }catch(e){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(_){ return null; } } }
  async function del(k){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction(ST,'readwrite'); t.objectStore(ST).delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){} try{ localStorage.removeItem(k); }catch(_){}; return true; }
  return { set, get, del };
})();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ── file loading + persistence ── */
function pick(){ $('#file').click(); }
$('#file').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=''; });
function readFile(f){ const r=new FileReader(); r.onload=()=>{ try{ ingest(JSON.parse(r.result), f.name); }catch(err){ alert('Could not parse JSON: '+err.message); } }; r.readAsText(f); }
function ingest(d, name, opts){
  opts=opts||{};
  DATA=d;
  DUPINDEX={}; FAMBYMAT={}; UNITINDEX={}; MATBYMN={}; FLEETBYUNIT={}; CATINDEX={};
  (d.materials||[]).forEach(x=>{
    MATBYMN[String(x.material)]=x;
    if(x.duplicate_group){ (DUPINDEX[x.duplicate_group]=DUPINDEX[x.duplicate_group]||[]).push(x); }
    (x.where_used||[]).forEach(wu=>{ if(!wu||!wu.unit) return; (UNITINDEX[wu.unit]=UNITINDEX[wu.unit]||[]).push({mn:String(x.material), qty:wu.qty}); });
    const cc=x.category||'Unclassified'; (CATINDEX[cc]=CATINDEX[cc]||[]).push(x);
  });
  (d.families||[]).forEach(f=>{ (f.members||[]).forEach(mm=>{ FAMBYMAT[String(mm.material)]=f; }); });
  (d.fleet||[]).forEach(u=>{ if(u&&u.unit) FLEETBYUNIT[String(u.unit)]=u; });
  const m=d.meta||{};
  $('#saveInd').textContent = opts.restored ? 'restored' : '';
  goHome();
  if(!opts.restored){
    Store.set(STORE_KEY, { d, name:name||null, savedAt:new Date().toISOString() }).then(ok=>{ $('#saveInd').textContent = ok?'saved in browser':''; });
  }
}
async function clearSaved(){
  await Store.del(STORE_KEY);
  DATA=null; $('#saveInd').textContent='';
  toast('Cleared saved dataset'); goHome();
}
function exportJson(){
  if(!DATA) return;
  const blob=new Blob([JSON.stringify(DATA)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='calibre_map_dataset_'+(new Date().toISOString().slice(0,10))+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

    return `<div class="okbox"><b>Field-verified · family ${esc(fam.family_id)}</b> ${vlabel}${fam.provisional?' <span class="pillv prov">no tech pref</span>':''}
      <div style="margin:6px 0 2px">This part: <b class="${me&&me.keep?'':'ret'}" style="color:${me&&me.keep?'var(--ok)':'var(--crit)'}">${me&&me.keep?'KEEP':'retire'}</b>${fam.site_answer?' · “'+esc(fam.site_answer)+'”':''}${fam.tech?' · by '+esc(fam.tech):''}</div>
      ${others.map(mm=>dupRow(mm.material, mm.keep?'keep':'retire')).join('')}</div>`;
  }
  if(sibs.length){
    return `<div class="warnbox"><b>Candidate duplicates</b> <span class="pillv cand">unverified</span> — this part shares a duplicate group (<i>${esc(m.duplicate_group)}</i>) with ${sibs.length} other${sibs.length>1?'s':''} in the traced register. Not yet field-verified — check the bins before ordering.
      ${sibs.map(s=>dupRow(s.material)).join('')}</div>`;
  }
  return '<div class="note">No known duplicates for this part.</div>';
}

/* ═══ MODE 1b · START FROM A UNIT ═══ */
function unitSearch(q){
  const U=$('#units'); if(!U) return; LASTUQ=q||'';
  const n=(q||'').toUpperCase();
  const units=Object.keys(UNITINDEX).sort();
  const list=units.filter(u=>!n||u.toUpperCase().includes(n)).slice(0,60);
  U.innerHTML = list.length ? list.map(u=>{
    const parts=UNITINDEX[u]; const q2=parts.reduce((s,p)=>s+(+p.qty||0),0);
    return `<div class="row" onclick="unitView('${esc(u)}')">
      <span class="tic">${IC.truck}</span>
      <div style="flex:1;min-width:0"><div class="t">${esc(u)}</div>
        <div class="s">${parts.length} part${parts.length>1?'s':''} consumed · ${nf(Math.round(q2))} issued</div></div>
      <span class="chev">${IC.chev}</span></div>`;
  }).join('') : '<div class="note">No unit matches. Units come from the work-order (where-used) history in the dataset.</div>';
}
// unit → pick a system zone (mirrors the app's "Start from a unit" drill)
function partsInCats(cats, kw){
  const re = kw ? new RegExp(kw,'i') : null;
  return (DATA.materials||[]).filter(m=> m.category && cats.indexOf(m.category)>=0 && (!re || re.test((m.description||'')+' '+(m.fits||''))));
}
function unitView(uid){
  const u=FLEETBYUNIT[uid]||{unit:uid};
  const consumed=(UNITINDEX[uid]||[]);
  crumb('Unit · '+uid); here('unit:'+uid, ()=>unitView(uid));
  const zones=zonesFor(u);
  const zoneTiles=zones.map(z=>{ const n=partsInCats(z.cats).length;
    return `<div class="tile ${n?'':'zero'}" onclick="zoneView('${esc(uid)}','${z.id}')">
      <span class="tic">${IC.layers}</span>
      <div style="flex:1"><div class="tn">${esc(z.label)}</div><div class="tc">${n} part${n===1?'':'s'}</div></div>
      <span class="chev">${IC.chev}</span></div>`;
  }).join('');
  const nc=new Set(consumed.map(c=>c.mn)).size;
  M.innerHTML = `
  <div class="hero"><div class="eyebrow-mono">${esc([u.type,u.year,u.engine].filter(Boolean).join(' · ')||'unit')}</div>
    <div class="pn">${esc(uid)}</div><div class="dl">${esc([u.make,u.model].filter(Boolean).join(' ')||'not in fleet register')}</div></div>
  <h3 style="color:var(--map)">Pick a system</h3>
  <div class="tiles">${zoneTiles}</div>
  ${nc?`<div class="tile consumed" onclick="unitConsumed('${esc(uid)}')" style="margin-bottom:14px">
      <span class="tic">${IC.clock}</span>
      <div style="flex:1"><div class="tn">Parts actually consumed here</div><div class="tc">${nc} part${nc===1?'':'s'} issued on this unit's work orders</div></div>
      <span class="chev">${IC.chev}</span></div>`:''}
  <button class="ghost" onclick="goBack()">← back</button>`;
}
function zoneView(uid, zid){
  const u=FLEETBYUNIT[uid]||{unit:uid};
  const z=zonesFor(u).find(x=>x.id===zid); const ss=SUBSYS[zid];
  if(!ss) return compView(uid, zid, -1);
  crumb(uid+' · '+z.label); here('zone:'+uid+':'+zid, ()=>zoneView(uid,zid));
  const tiles=ss.map((c,i)=>{ const n=partsInCats(c.cats, c.kw).length;
    return `<div class="tile ${n?'':'zero'}" onclick="compView('${esc(uid)}','${zid}',${i})">
      <span class="tic">${IC.box}</span>
      <div style="flex:1"><div class="tn">${esc(c.l)}</div><div class="tc">${n} part${n===1?'':'s'}</div></div>
      <span class="chev">${IC.chev}</span></div>`;
  }).join('');
  M.innerHTML = `
  <div class="hero"><div class="eyebrow-mono">${esc(uid)} · ${esc(z.label)}</div><div class="pn" style="font-size:24px">Pick a sub-system</div></div>
  <div class="tiles">${tiles}</div>
  <button class="ghost" onclick="goBack()">← back</button>`;
}
function compView(uid, zid, ci){
  const u=FLEETBYUNIT[uid]||{unit:uid};
  const z=zonesFor(u).find(x=>x.id===zid); const ss=SUBSYS[zid];
  const comp = (ci>=0 && ss) ? ss[ci] : null;
  const cats = comp ? comp.cats : (z?z.cats:[]);
  const mk = String(u.make||'').toUpperCase().slice(0,6);
  let parts = partsInCats(cats, comp?comp.kw:null);
  parts.sort((a,b)=>{ const am=((a.fits||'')+(a.description||'')).toUpperCase().includes(mk)&&mk?0:1;
    const bm=((b.fits||'')+(b.description||'')).toUpperCase().includes(mk)&&mk?0:1;
    return am-bm || (Number(b.on_hand)||0)-(Number(a.on_hand)||0); });
  crumb(uid+' · '+(comp?comp.l:(z?z.label:''))); here('comp:'+uid+':'+zid+':'+ci, ()=>compView(uid,zid,ci));
  M.innerHTML = `
  <div class="hero"><div class="eyebrow-mono">${esc(uid)}${z?' · '+esc(z.label):''}</div>
    <div class="pn" style="font-size:24px">${esc(comp?comp.l:(z?z.label:'Parts'))}</div>
    <div class="dl">${parts.length} part${parts.length===1?'':'s'}${mk?' · '+esc(u.make)+'-matched first':''}</div></div>
  ${parts.length?`<div class="list">${parts.slice(0,120).map(m=>partRow(m)).join('')}</div>`
    :'<div class="note">No parts in this sub-system for the current dataset. Coverage grows as identity work categorises more of the material master.</div>'}
  <button class="ghost" onclick="goBack()">← back</button>`;
}
function unitConsumed(uid){
  const parts=(UNITINDEX[uid]||[]).slice();
  crumb('Unit · '+uid+' · consumed'); here('unitc:'+uid, ()=>unitConsumed(uid));
  const agg={}; parts.forEach(p=>{ agg[p.mn]=(agg[p.mn]||0)+(+p.qty||0); });
  const rows=Object.keys(agg).map(mn=>({m:MATBYMN[mn], qty:agg[mn]})).filter(x=>x.m).sort((a,b)=>b.qty-a.qty);
  M.innerHTML = `
  <div class="hero"><div class="eyebrow-mono">Unit · work-order history</div><div class="pn">${esc(uid)}</div>
    <div class="dl">${rows.length} distinct part${rows.length===1?'':'s'} consumed</div></div>
  <div class="list">${rows.map(r=>`<div class="row" onclick="partView('${esc(String(r.m.material))}')">
    <div style="flex:1;min-width:0">
      <div class="t"><span class="sap">SAP#</span> ${esc(r.m.material)}${r.m.pn?` <b>· ${esc(r.m.pn)}</b>`:''}</div>
      <div class="s">${esc(r.m.description||'')}${r.m.traced_brand?' · '+esc(r.m.traced_brand):''}</div>
      <div class="badges"><span class="badge b-net">Qty ${esc(nf(Math.round(r.qty)))}</span>${dupBadge(r.m)}</div>
    </div><span class="chev">${IC.chev}</span></div>`).join('')}</div>
  <button class="ghost" onclick="goBack()">← back</button>`;
}

/* ═══ MODE 2 · DUPLICATE FAMILIES ═══ */
function dupHome(){
  crumb('Duplicate Families'); here('dup', dupHome);
  const fams=(DATA.families||[]);
  const vp=v=> v==='SAME'?'<span class="pillv same">SAME → merge</span>':v==='SPLIT'?'<span class="pillv split">SPLIT</span>':'<span class="pillv">'+esc(v)+'</span>';
  const cands=Object.entries(DUPINDEX).filter(([g,a])=>a.length>1).map(([g,a])=>({g,a})).sort((x,y)=>y.a.length-x.a.length);
  const famHtml = fams.length ? `<div class="grid2">${fams.map(f=>`
    <div class="fam"><div class="fh"><span class="fid">${esc(f.family_id)}</span>${vp(f.verdict)}${f.provisional?'<span class="pillv prov">no tech pref</span>':''}</div>
      ${(f.members||[]).map(mm=>`<div class="memb" data-mn="${esc(mm.material)}"><span class="mnm">${esc(mm.material)}</span><span class="${mm.keep?'keep':'ret'}">${mm.keep?'KEEP':'retire'} · pile ${esc(mm.pile)}</span></div>`).join('')}
      <div class="note">${f.tech?('by '+esc(f.tech)+' · '):''}${f.ts?esc(String(f.ts).slice(0,10)):''}${f.site_answer?' · “'+esc(f.site_answer)+'”':''}</div>
    </div>`).join('')}</div>` : '<div class="note">No field-verified families in this dataset yet.</div>';
  const candHtml = cands.length ? `<div class="grid2">${cands.map(c=>`
    <div class="fam cand"><div class="fh"><span class="fid sm">${esc(c.g)}</span><span class="pillv cand">${c.a.length} candidates</span></div>
      ${c.a.map(s=>`<div class="memb" data-mn="${esc(s.material)}"><span class="mnm">${esc(s.material)}</span><span class="muted">${esc(s.pn||'')}${s.traced_brand?' · '+esc(s.traced_brand):''}</span></div>`).join('')}
    </div>`).join('')}</div>` : '<div class="note">No candidate groups in this dataset.</div>';
  M.innerHTML = `
  <h2 style="color:var(--verify-t)">Duplicate families</h2>
  <h3>Field-verified — ${fams.length}</h3>${famHtml}
  <h3 style="margin-top:20px">Candidate groups · desk hypothesis — ${cands.length}</h3>
  <div class="note" style="margin-bottom:10px">Parts sharing a duplicate group in the traced register — potential duplicates not yet physically verified. Tap any part to open its record.</div>${candHtml}
  <button class="ghost" onclick="goHome()">← home</button>`;
  document.querySelectorAll('#main .memb[data-mn]').forEach(el=>el.addEventListener('click',()=>partView(el.dataset.mn)));
}

/* ═══ MODE 3 · FLEET & UNITS ═══ */
function fleetHome(){
  crumb('Fleet & Units'); here('fleet', fleetHome);
  const needs=(DATA.needs_identification||[]);
  M.innerHTML = `
  <h2 style="color:var(--equip-t)">Fleet &amp; units</h2>
  <input class="search" id="uq" placeholder="Unit number (TT3084, TT3008…)" value="${esc(LASTUQ)}" oninput="unitSearch(this.value)">
  <h3>Units — ${Object.keys(UNITINDEX).length}</h3>
  <div id="units" class="list"></div>
  <h3 style="margin-top:20px">Needs identification — ${needs.length}</h3>
  <div class="note" style="margin-bottom:8px">Consumed on work orders but absent from the material master — candidates for the assessment tool.</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">${ needs.length ? needs.map(mn=>{ const has=MATBYMN[String(mn)]; return `<span class="badge" style="cursor:${has?'pointer':'default'};color:${has?'var(--map)':'var(--text-m)'}" ${has?`onclick="partView('${esc(String(mn))}')"`:''}>${esc(mn)}</span>`; }).join('') : '<span class="note">None — every consumed material is in the master.</span>' }</div>
  <button class="ghost" onclick="goHome()">← home</button>`;
  unitSearch(LASTUQ);
}

/* ═══ MODE 4 · DATA & SETTINGS ═══ */
function dataHome(){
  crumb('Data & Settings'); here('data', dataHome);
  const m=DATA.meta||{}, c=DATA.counts||{}, sb=DATA.scoreboard||null;
  let sbHtml='';
  if(sb){
    const tot=sb.retireSkus||0; const seg=(n,col)=>{ const pct=tot?Math.round(100*n/tot):0; return pct?`<span style="width:${pct}%;background:${col}">${pct>7?n:''}</span>`:''; };
    sbHtml = `<div class="card" style="margin-bottom:12px"><div class="fh" style="color:var(--core)">Removal scoreboard</div>
      <div class="kpis">
        <div class="kpi ok"><div class="n">${sb.pctEliminated}%</div><div class="l">eliminated</div></div>
        <div class="kpi crit"><div class="n">${sb.reorderRisk}</div><div class="l">reorder-on-retire</div></div>
        <div class="kpi ok"><div class="n">${sb.runningDown}</div><div class="l">running-down</div></div>
        <div class="kpi"><div class="n">${sb.retireSkus}</div><div class="l">retire SKUs · ${sb.families} fam</div></div>
      </div>
      <div class="bar">${seg(sb.eliminated,'var(--text-d)')}${seg(sb.runningDown,'var(--ok)')}${seg(sb.reorderRisk,'var(--crit)')}</div>
      <div class="note">${nf(sb.onHandInRetire)} units on-hand tied in retired numbers to run down${sb.provisionalFamilies?` · ${sb.provisionalFamilies} family(ies) “no technical preference”`:''}.</div></div>`;
  }
  M.innerHTML = `
  <h2 style="color:var(--core)">Data &amp; settings</h2>
  ${sbHtml}
  <div class="card" style="margin-bottom:12px"><div class="fh" style="color:var(--core)">Dataset</div><div class="kv">
    <div class="k">Schema</div><div class="v">v${esc(DATA.schemaVersion||'?')}</div>
    <div class="k">Client</div><div class="v">${esc(m.clientCode||'—')}${m.site?' · '+esc(m.site):''}</div>
    <div class="k">Generated</div><div class="v">${esc(m.generatedAt||'—')}</div>
    <div class="k">Engine phase</div><div class="v">${esc(m.phase||'—')}</div>
    <div class="k">Counts</div><div class="v">${nf(c.materials||0)} parts · ${nf(c.families||0)} families · ${nf(c.dispositions||0)} dispositions · ${nf(c.needsIdentification||0)} need ID</div>
    <div class="k">Sources</div><div class="v" style="font-family:var(--f-mono);font-size:11.5px">${Object.values(m.sourceFiles||{}).filter(Boolean).map(esc).join('<br>')||'—'}</div>
    <div class="k">Storage</div><div class="v">${esc($('#saveInd').textContent||'not saved')} — kept in this browser (IndexedDB)</div>
  </div></div>
  <div class="btnrow">
    <button class="primary core" onclick="pick()">⤒ Load / swap dataset</button>
    <button class="ghost" onclick="exportJson()">⤓ Export JSON</button>
    <button class="ghost" onclick="clearSaved()">⌫ Clear saved dataset</button>
  </div>
  <div class="note">“Clear” forgets the dataset saved in this browser and returns to the load screen. Downloaded files on disk are unaffected.</div>
  <button class="ghost" onclick="goHome()">← home</button>`;
}

/* ── init: restore last dataset, else show load ── */
Store.get(STORE_KEY).then(rec=>{
  if(rec && rec.d && Array.isArray(rec.d.materials)){ ingest(rec.d, rec.name, {restored:true}); }
  else goHome();
}).catch(()=>goHome());
</script>
</body>
</html>
